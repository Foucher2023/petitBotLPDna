<script>
document.addEventListener("DOMContentLoaded", function() {
  // Détection mobile ou petit écran
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 675;

  if (isMobile) {
    // On garde le header (ou la nav) et on masque tout le reste
    const header = document.querySelector("header") || document.querySelector("nav");

    // Supprime tout sauf le header
    document.body.innerHTML = "";
    if (header) document.body.appendChild(header);

    // Ajoute le message bloquant
    const message = document.createElement("div");
    message.style = `
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      font-family: Verdana, sans-serif;
      background-color: #021429;
      color: white;
      padding: 20px;
    `;
    message.innerHTML = `
      <h1>⚠️ Cette page ne fonctionne que sur ordinateur</h1>
      <p>Veuillez vous connecter depuis un PC.</p>
    `;

    document.body.appendChild(message);
  }
});
</script>
